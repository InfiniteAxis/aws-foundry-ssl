# Plain HTTP: everything redirects to HTTPS (certs use DNS-01, so no ACME path is needed).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Unknown hostnames on 443 get no certificate and no content.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
