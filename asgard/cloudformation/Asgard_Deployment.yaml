AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Asgard (v4 rebuild of Valhalla; DRAFT, UNTESTED): Foundry VTT + nginx + app host (kotw bot, FamilyMUD,
  static website) + GitLab runners. Self-contained fork of aws-foundry-ssl v3.0.1.
  Deploy as a NEW stack alongside the old one. Never update the old "Valhalla" stack in place.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Instance" }
        Parameters: [HostName, InstanceType, VolumeSize, AdminSshPublicKey, SshAllowedCidr, AlertEmail]
      - Label: { default: "DNS and TLS" }
        Parameters: [HostedZoneId, DomainName, FoundrySubdomain, ManageDns, LetsEncryptEmail, LetsEncryptStaging]
      - Label: { default: "Foundry" }
        Parameters: [FoundryDownloadLink, FoundryNodeVersion, FoundryNodeSha256, S3BucketName]
      - Label: { default: "Source of setup scripts" }
        Parameters: [RepoUrl, RepoBranch, SetupPath, GitDeployUser, GitDeployToken]
      - Label: { default: "Backups" }
        Parameters: [SnapshotRetainCount]

Parameters:
  HostName:
    Type: String
    Default: asgard
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: "OS hostname and Name tag of the new box."
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 200
  AdminSshPublicKey:
    Type: String
    Default: ""
    Description: "Optional ed25519 public key for the 'axis' user. Empty = SSM Session Manager only."
  SshAllowedCidr:
    Type: String
    Default: ""
    Description: "CIDR allowed to reach port 22 (e.g. 203.0.113.7/32). Empty = no SSH rule at all."
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  AlertEmail:
    Type: String
    Description: "Email for CloudWatch alarm notifications (confirm the SNS subscription mail)."
  HostedZoneId:
    Type: String
    Description: "Route 53 hosted zone ID for the domain (Z07010851LDVTXRVWM6JI)."
  DomainName:
    Type: String
    Default: infiniteaxis.tv
  FoundrySubdomain:
    Type: String
    Default: foundrytest
    Description: "Use foundrytest for the trial run. At cutover this becomes 'foundry'."
    AllowedPattern: '^[a-z0-9-]+$'
  ManageDns:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: "true = the box UPSERTs the Foundry A record (at boot and every 24h). Leave false until cutover."
  LetsEncryptEmail:
    Type: String
  LetsEncryptStaging:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Use the Let's Encrypt staging CA for trial runs (avoids rate limits)."
  FoundryDownloadLink:
    Type: String
    NoEcho: true
    Description: "Time-limited Foundry 'Linux/Node' download URL from foundryvtt.com. (Visible in instance user data; it expires.)"
  FoundryNodeVersion:
    Type: String
    Default: "24.22.1"
    AllowedPattern: '^\d+\.\d+\.\d+$'
    Description: "Node used ONLY by Foundry (pinned tarball in /opt/foundry-node). Foundry 14 needs >= 24.22.1; bump to the newest 24.x patch at deploy time (the checksum is fetched from nodejs.org)."
  FoundryNodeSha256:
    Type: String
    Default: ""
    Description: "Optional override of the expected SHA256 of node-v<ver>-linux-arm64.tar.xz. Empty = fetch SHASUMS256.txt from nodejs.org (TLS)."
  S3BucketName:
    Type: String
    Description: "Existing S3 bucket Foundry uses for assets. Access is via the instance role (no IAM user keys). UNTESTED with Foundry: see RUNBOOK."
  RepoUrl:
    Type: String
    Default: https://gitlab.com/valhalla-software/aws-foundry-ssl.git
    Description: "HTTPS clone URL of the repo containing the setup scripts. Must be pushed before deploying."
  SetupPath:
    Type: String
    Default: asgard/setup
    Description: "Path of the setup directory inside the repo ('asgard/setup' while this lives inside the aws-foundry-ssl repo)."
  GitDeployUser:
    Type: String
    Default: ""
    Description: "GitLab deploy token username (read_repository). Empty = clone anonymously (public repo)."
  GitDeployToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "GitLab deploy token. Visible in instance user data: give it a short expiry and revoke it after the build."
  RepoBranch:
    Type: String
    Default: main
  SnapshotRetainCount:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 30

Conditions:
  HasSshCidr: !Not [!Equals [!Ref SshAllowedCidr, ""]]

Mappings: {}

Resources:
  # ---------------- Network ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/25
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  SubnetRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Asgard (80, 443, 4000 MUD; 22 only if SshAllowedCidr set)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP/ACME redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 4000, ToPort: 4000, CidrIp: 0.0.0.0/0, Description: FamilyMUD telnet }
        # Foundry TURN/UDP deliberately closed (options.json has TURN off in this build).

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSshCidr
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshAllowedCidr
      Description: Admin SSH

  # ---------------- Identity ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: AsgardInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Assets
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}"
              - Sid: S3AssetObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:PutObjectAcl]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
              - Sid: Route53Zone
                Effect: Allow
                Action: [route53:ChangeResourceRecordSets, route53:ListResourceRecordSets]
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
              - Sid: Route53Global
                Effect: Allow
                Action: [route53:ListHostedZones, route53:ListHostedZonesByName, route53:GetChange]
                Resource: "*"
              - Sid: AssociateOwnEip
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DescribeAddresses]
                Resource: "*"
              - Sid: AppSecrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/asgard/*"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  # ---------------- Compute ----------------
  Eip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.12-arm64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: !Ref VolumeSize, Encrypted: true, DeleteOnTermination: true }
      Monitoring: false
      Tags:
        - { Key: Name, Value: !Ref HostName }
        - { Key: Snapshot, Value: "true" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/asgard-userdata.log) 2>&1
          TOKEN=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
          IID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          # Attach the stack's Elastic IP first so the install runs from the final address.
          dnf install -y git awscli-2 >/dev/null 2>&1 || dnf install -y git
          aws ec2 associate-address --region ${AWS::Region} --instance-id "$IID" --allocation-id ${Eip.AllocationId} --allow-reassociation || true
          install -d -m 700 /root/asgard
          umask 077
          cat > /root/asgard/variables.sh <<'VARS_EOF'
          export STACK_NAME='${AWS::StackName}'
          export HOST_NAME='${HostName}'
          export AWS_REGION='${AWS::Region}'
          export HOSTED_ZONE_ID='${HostedZoneId}'
          export DOMAIN_NAME='${DomainName}'
          export FOUNDRY_SUBDOMAIN='${FoundrySubdomain}'
          export MANAGE_DNS='${ManageDns}'
          export LE_EMAIL='${LetsEncryptEmail}'
          export LE_STAGING='${LetsEncryptStaging}'
          export FOUNDRY_NODE_VERSION='${FoundryNodeVersion}'
          export FOUNDRY_NODE_SHA256='${FoundryNodeSha256}'
          export S3_BUCKET='${S3BucketName}'
          export ADMIN_SSH_PUBKEY='${AdminSshPublicKey}'
          export EIP_ALLOCATION_ID='${Eip.AllocationId}'
          export EIP_ADDRESS='${Eip}'
          VARS_EOF
          printf "export FOUNDRY_DOWNLOAD_LINK='%s'\n" '${FoundryDownloadLink}' >> /root/asgard/variables.sh
          GIT_URL='${RepoUrl}'
          if [ -n '${GitDeployToken}' ]; then GIT_URL="$(echo "$GIT_URL" | sed 's#https://#https://${GitDeployUser}:${GitDeployToken}@#')"; fi
          git clone --depth 1 --branch '${RepoBranch}' "$GIT_URL" /root/asgard/repo
          git -C /root/asgard/repo remote set-url origin '${RepoUrl}'
          bash /root/asgard/repo/${SetupPath}/install.sh

  # ---------------- Alerts ----------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]
  StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: EC2 status check failed for 10 minutes
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  # TODO: disk_used_percent alarm (needs the CWAgent dimensions: host, path, device, fstype).

  # ---------------- Backups (instance-level, tag Snapshot=true) ----------------
  DlmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: dlm.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole]
  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub "${AWS::StackName} weekly snapshots"
      State: ENABLED
      ExecutionRoleArn: !GetAtt DlmRole.Arn
      PolicyDetails:
        ResourceType: INSTANCE
        TargetTags: [{ Key: Snapshot, Value: "true" }]
        Schedules:
          - Name: Weekly
            CopyTags: true
            CreateRule: { CronExpression: "cron(0 12 ? * MON *)" }
            RetainRule: { Count: !Ref SnapshotRetainCount }

  # ---------------- DNS (only when ManageDns=true) ----------------
  # The instance itself UPSERTs its record (hosted_zone_ip timer). Nothing is created here on purpose,
  # so deleting a stack never deletes a production record.

Outputs:
  InstanceId: { Value: !Ref Instance }
  ElasticIp: { Value: !Ref Eip }
  FoundryUrl: { Value: !Sub "https://${FoundrySubdomain}.${DomainName}" }
  SsmConnect: { Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}" }
  SetupLog: { Value: "/var/log/asgard-setup.log (also CloudWatch log group /asgard/setup)" }
